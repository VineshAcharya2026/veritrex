"$schema" = "./node_modules/wrangler/config-schema.json"
name = "tursthire"
main = "custom-worker.ts"
account_id = "c8a4f99bb63dae571ca58bfec17b0ad3"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[triggers]
# Daily 03:00 UTC — runs markUnilateral → trust recalc → cheat detection
crons = ["0 3 * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "tursthire"

[[d1_databases]]
binding = "DB"
database_name = "trusthire-db"
database_id = "4fdf52a5-c18a-4fbe-bb7a-e6727889054f"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "dc145a793f5d4919a0a796d834fba389"

# Mentor profile media — enable R2 in Cloudflare Dashboard first, then uncomment:
# [[r2_buckets]]
# binding = "MENTOR_CONTENT"
# bucket_name = "trust-hire-mentor-content"

# Optional: Next.js incremental cache (create bucket in Cloudflare dashboard)
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "trust-hire-next-cache"

# PostgreSQL connection pool — create in Cloudflare Dashboard → Hyperdrive, then set id:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-config-id>"

[observability]
enabled = true

# Cron: custom-worker.ts scheduled() → GET /api/cron (Bearer $CRON_SECRET)
# Also callable manually / via admin "Run integrity jobs" — see README.md
